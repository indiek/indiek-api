name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Lint (ruff)
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Tests
        run: uv run --locked pytest -q
