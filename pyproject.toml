[project]
name = "indiek-api"
version = "0.16.0"
description = "Local HTTP API serving IndieK archives to the IndieK Desktop App."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "indiek[keychain]>=1.3.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
indiek = { path = "../public_archive", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
